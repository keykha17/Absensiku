  --c-h:#3ec286; --c-h-bg:#143626; --c-t:#e5a443; --c-t-bg:#3d2d11; --c-i:#9d92f0; --c-i-bg:#26234a;
  --c-s:#5bb4e6; --c-s-bg:#12324a; --c-a:#ee7a7a; --c-a-bg:#471d1d; --on-st:#07130f; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
small,.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:18px 56px;display:flex;flex-direction:column;gap:16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .in{display:flex;align-items:center;gap:12px;padding-block:12px}
.mark{width:42px;height:42px;flex:none;object-fit:contain}
.brand{min-width:0;flex:1}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;white-space:nowrap}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--surface);border-bottom:1px solid var(--line)}
#tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 13px var(--font);padding:12px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card.flat{padding:0;overflow:hidden}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.head>div{min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
textarea{width:100%;resize:vertical}
input.num{width:64px;text-align:center;padding:6px 4px;min-height:34px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 13px var(--font);padding:8px 14px;min-height:38px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:12px}
.btn.danger{color:var(--c-a);border-color:var(--c-a)}
.btn.danger.armed{background:var(--c-a);color:var(--on-st)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px;font-weight:600}
.stat small{display:block;margin-top:2px}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);white-space:nowrap}
td.c,th.c{text-align:center}
tr:last-child td{border-bottom:0}
td.low,.low{color:var(--c-a);font-weight:700}
.sticky1{position:sticky;left:0;background:var(--surface);z-index:1}
th.sticky1{background:var(--surface-2)}
.empty{color:var(--muted);padding:18px;text-align:center}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.banner b{color:var(--accent)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{appearance:none;width:40px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:700 13px var(--font);cursor:pointer}
.seg button.st-H.on{background:var(--c-h);border-color:var(--c-h);color:var(--on-st)}
.seg button.st-T.on{background:var(--c-t);border-color:var(--c-t);color:var(--on-st)}
.seg button.st-I.on{background:var(--c-i);border-color:var(--c-i);color:var(--on-st)}
.seg button.st-S.on{background:var(--c-s);border-color:var(--c-s);color:var(--on-st)}
.seg button.st-A.on{background:var(--c-a);border-color:var(--c-a);color:var(--on-st)}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .an{flex:1 1 200px;min-width:0}
.arow .an b{display:block;font-weight:600}
.arow .ket{flex:1 1 180px;min-width:0}
.cnt{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.pill.H{background:var(--c-h-bg);color:var(--c-h)}.pill.T{background:var(--c-t-bg);color:var(--c-t)}
.pill.I{background:var(--c-i-bg);color:var(--c-i)}.pill.S{background:var(--c-s-bg);color:var(--c-s)}
.pill.A{background:var(--c-a-bg);color:var(--c-a)}.pill.N{background:var(--surface-2);color:var(--muted)}
.mk{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:5px;font-size:11px;font-weight:700}
.mk.H{background:var(--c-h-bg);color:var(--c-h)}.mk.T{background:var(--c-t-bg);color:var(--c-t)}
.mk.I{background:var(--c-i-bg);color:var(--c-i)}.mk.S{background:var(--c-s-bg);color:var(--c-s)}
.mk.A{background:var(--c-a-bg);color:var(--c-a)}
.rk th.fri,.rk td.fri{background:var(--surface-2)}
.rk td,.rk th{padding:6px 4px}
.rk td.nm{padding-left:10px;padding-right:10px;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block}
.gl{stroke:var(--line);stroke-width:1}
.ct{fill:var(--muted);font:11px var(--font)}
.cv{fill:var(--fg);font:700 11px var(--font)}
.bar-rect{fill:var(--accent)}
.list{display:flex;flex-direction:column}
.list .li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li>div{min-width:0}
.prog{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(5,15,12,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:640px;margin-top:4vh}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin:14px 0}
.ff .wide{grid-column:1/-1}
.ff input,.ff select{width:100%}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;max-width:calc(100% - 32px);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
/* Rapor: kertas dokumen, selalu terang agar cocok dicetak */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:28px 30px;max-width:820px;width:100%;margin:0 auto;font-size:13px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.paper *{border-color:#c9d1ce}
.paper .ph{text-align:center;border-bottom:3px double var(--paper-line);padding-bottom:12px;margin-bottom:14px}
.paper .ar{font:400 26px/1.6 var(--font-ar);color:var(--gold)}
.paper .ph h1{font-size:17px;font-weight:800;letter-spacing:.04em}
.paper .ph p{margin:2px 0 0;font-size:12px;color:#44514c}
.paper .idn{display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;margin-bottom:14px}
.paper .idn div{display:flex;gap:6px}
.paper .idn span:first-child{width:96px;flex:none;color:#44514c}
.paper h4{margin:14px 0 6px;font-size:13px;font-weight:800}
.paper table th{background:#eef3f1;color:#26332e;border:1px solid #c9d1ce}
.paper table td{border:1px solid #c9d1ce;padding:5px 8px}
.paper .sum td{font-weight:700;background:#f6f9f8}
.paper .note{border:1px solid #c9d1ce;border-radius:4px;padding:8px 10px;min-height:48px;white-space:pre-wrap}
.paper .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;margin-top:22px;font-size:12px}
.paper .sign .sp{height:56px}
.hint{font-size:12px;color:var(--muted)}
.paper{min-width:0}
.paper table{table-layout:auto;width:100%;max-width:100%}
.paper th{white-space:normal}
@media (max-width:560px){.paper table th{width:auto!important;padding:5px 3px;font-size:10.5px}.paper table td{padding:5px 3px;font-size:12px}.paper{padding:18px 12px}.paper .idn{grid-template-columns:1fr}.paper .sign{grid-template-columns:1fr}.stat b{font-size:24px}}
@page{size:A4;margin:14mm 14mm}
@media print{
  header.top,nav.tabs,.noprint,.toast,body::before{display:none!important}
  body{background:#fff}
  main.wrap{padding:0;max-width:none}
  .paper{border:0;box-shadow:none;padding:0;max-width:none}
  .paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paper{font-size:11.5px;line-height:1.4}
  .paper .ph{padding-bottom:8px;margin-bottom:10px}
  .paper .ar{font-size:22px;line-height:1.4}
  .paper h4{margin:10px 0 4px}
  .paper table td{padding:3px 8px}
  .paper .note{min-height:36px}
  .paper .sign{margin-top:14px;break-inside:avoid;page-break-inside:avoid}
  .paper .sign .sp{height:42px}
  .paper table,.paper tr{break-inside:avoid;page-break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var DOW=['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

function parts(s){return s.split('-').map(Number);}
function fmtTgl(s){var p=parts(s);return p[2]+' '+MONTHS[p[1]-1]+' '+p[0];}

function kelasName(id){var k=S.kelas.find(function(x){return x.id===id;});return k?k.nama:'-';}

function nilaiAkhir(n){
  if(!n)return null;var w=S.set.bobot,sum=0,tw=0;
  [['tugas',w.tugas],['uh',w.uh],['uts',w.uts],['uas',w.uas]].forEach(function(p){var v=n[p[0]];if(v!==''&&v!=null&&!isNaN(v)){sum+=Number(v)*p[1];tw+=Number(p[1]);}});
  return tw?sum/tw:null;
}
function predL(v){return v==null?'-':v>=90?'A':v>=80?'B':v>=70?'C':v>=60?'D':'E';}
function predFull(v){var l=predL(v);return l==='-'?'-':l+' ('+PRED[l]+')';}

function totalSantri(sid){return S.mapel.reduce(function(a,m){var v=nilaiAkhir(S.nilai[nk(sid,m.id)]);return a+(v==null?0:v);},0);}

  var l=santriOf(kid).map(function(s){return {id:s.id,r:rataSantri(s.id)};}).filter(function(x){return x.r!=null;}).sort(function(a,b){return b.r-a.r;});
  var map={};l.forEach(function(x,i){map[x.id]=(i>0&&Math.abs(l[i-1].r-x.r)<1e-9)?map[l[i-1].id]:i+1;});return {map:map,n:l.length};
}

function hitung(sid,from,to,sesi){
  var c={H:0,T:0,I:0,S:0,A:0};
  for(var key in S.abs){var p=key.split('|');if(p[0]<from||p[0]>to)continue;if(sesi&&sesi!=='*'&&p[2]!==sesi)continue;var e=S.abs[key][sid];if(e&&c[e.s]!=null)c[e.s]++;}
  return c;
}

/* ---------- Rekap ---------- */
var SEV={H:0,T:1,I:2,S:3,A:4};
function rekapData(){
  var u=ui.rekap,p=parts(u.month+'-01'),nd=new Date(p[0],p[1],0).getDate(),by={};
  for(var key in S.abs){var q=key.split('|');if(q[0].indexOf(u.month)!==0||q[1]!==u.kelas)continue;if(u.sesi!=='*'&&q[2]!==u.sesi)continue;(by[q[0]]=by[q[0]]||[]).push(S.abs[key]);}
  var rows=santriOf(u.kelas).map(function(s){
    var days=[],c={H:0,T:0,I:0,S:0,A:0};
    for(var d=1;d<=nd;d++){var ds=u.month+'-'+pad(d),w=null;(by[ds]||[]).forEach(function(e){var x=e[s.id];if(x){c[x.s]++;if(w==null||SEV[x.s]>SEV[w])w=x.s;}});days.push(w);}
    return {s:s,days:days,c:c,pct:pctOf(c)};
  });
  return {nd:nd,rows:rows,y:p[0],m:p[1]};
}
function pgRekap(){

    +'<div class="bar" style="margin-top:14px"><div class="fld"><label for="r-m">Bulan</label><input id="r-m" type="month" data-ch="ui" data-p="rekap" data-k="month" value="'+esc(u.month)+'"></div>'
    +'<div class="fld"><label for="r-k">Kelas</label>'+sel('id="r-k" data-ch="ui" data-p="rekap" data-k="kelas"',kelasOpts(),u.kelas)+'</div>'
    +'<div class="fld"><label for="r-s">Sesi</label>'+sel('id="r-s" data-ch="ui" data-p="rekap" data-k="sesi"',[['*','Semua sesi (terburuk per hari)']].concat(S.set.sesi.map(function(x){return [x,x];})),u.sesi)+'</div></div></div>';
  var th='';for(var d=1;d<=D.nd;d++)th+='<th class="c'+fri(d)+'">'+d+'</th>';
  h+='<div class="card flat"><div class="tw"><table class="rk"><thead><tr><th class="sticky1" style="padding-left:10px">Nama</th>'+th+'<th class="c">H</th><th class="c">T</th><th class="c">I</th><th class="c">S</th><th class="c">A</th><th class="c">%</th></tr></thead><tbody>'
    +(D.rows.length?D.rows.map(function(r){return '<tr><td class="nm sticky1">'+esc(r.s.nama)+'</td>'+r.days.map(function(x,i){return '<td class="c'+fri(i+1)+'">'+(x?'<span class="mk '+x+'">'+x+'</span>':'')+'</td>';}).join('')+'<td class="c">'+r.c.H+'</td><td class="c">'+r.c.T+'</td><td class="c">'+r.c.I+'</td><td class="c">'+r.c.S+'</td><td class="c'+(r.c.A?' low':'')+'">'+r.c.A+'</td><td class="c"><b>'+(r.pct==null?'-':r.pct+'%')+'</b></td></tr>';}).join(''):'<tr><td colspan="'+(D.nd+7)+'" class="empty">Belum ada santri.</td></tr>')+'</tbody></table></div></div>'
    +'<div class="legend"><span>Kolom bertanda abu-abu adalah hari Jumat.</span><span>Persentase = (Hadir + Terlambat) dibagi total sesi tercatat.</span></div>';

/* ---------- Nilai ---------- */
function nilaiRow(s,i,m){
  var n=S.nilai[nk(s.id,m.id)]||{},v=nilaiAkhir(n),r=v==null?null:Math.round(v*10)/10;

function nilaiSummary(){
  var m=S.mapel.find(function(x){return x.id===ui.nilai.mapel;});if(!m)return '';

  var wf=function(k,l){return '<div class="fld"><label for="w-'+k+'">'+l+' (%)</label><input id="w-'+k+'" type="number" min="0" max="100" data-ch="bobot" data-k="'+k+'" value="'+w[k]+'"></div>';};
  return '<div class="card"><h2>Identitas pesantren</h2><div class="ff">'+f('pesantren','Nama pesantren')+f('alamat','Alamat')+f('kota','Kota (untuk tanda tangan rapor)')+f('mudir','Nama mudir / pengasuh')+'</div></div>'
    +'<div class="card"><h2>Periode aktif</h2><div class="ff">'+f('tahun','Tahun ajaran','text','placeholder="2026/2027"')+'<div class="fld"><label for="s-sem">Semester</label>'+sel('id="s-sem" data-ch="set" data-k="sem"',[['Ganjil','Ganjil (Juli - Desember)'],['Genap','Genap (Januari - Juni)']],s.sem)+'</div></div><p class="hint">Nilai dan rapor disimpan terpisah untuk setiap tahun ajaran dan semester. Absensi mengikuti tanggal.</p></div>'
    +'<div class="card"><h2>Bobot nilai</h2><div class="ff">'+wf('tugas','Tugas')+wf('uh','Ulangan harian')+wf('uts','UTS')+wf('uas','UAS')+'</div><p class="hint'+(tot!==100?' low':'')+'">Total bobot '+tot+'%'+(tot!==100?' (disarankan 100%, perhitungan tetap dinormalkan)':'')+'.</p></div>'
    +'<div class="card"><h2>Sesi absensi</h2><div class="ff"><div class="fld wide"><label for="s-sesi">Daftar sesi, pisahkan dengan koma</label><input id="s-sesi" data-ch="sesi" value="'+esc(s.sesi.join(', '))+'"></div>'
    +'<div class="fld"><label for="s-sr">Sesi yang dihitung di rapor</label>'+sel('id="s-sr" data-ch="set" data-k="sesiRapor"',[['*','Semua sesi']].concat(s.sesi.map(function(x){return [x,x];})),s.sesiRapor)+'</div></div></div>'
    +'<div class="card"><h2>Cadangan data</h2><p class="hint">Data tersimpan di browser ini. Salin cadangan secara berkala, lalu tempel di kotak ini untuk memulihkan di perangkat lain.</p>'
    +'<textarea id="bk" rows="5" placeholder="Cadangan data (JSON) muncul di sini" style="margin:10px 0"></textarea><div class="acts" style="justify-content:flex-start"><button class="btn pri" data-act="bk-copy">Salin cadangan</button>'+(framed?'':'<button class="btn" data-act="bk-dl">Unduh file</button>')+'<button class="btn" data-act="bk-restore">Pulihkan dari kotak</button><button class="btn" data-act="bk-pick">Impor dari file</button><input id="bk-file" type="file" accept=".json,application/json,text/plain" hidden></div></div>'
    +'<div class="card"><h2>Data</h2><div class="acts" style="justify-content:flex-start"><button class="btn" data-act="load-demo">Muat data contoh</button><button class="btn danger'+(ui.armed==='wipe'?' armed':'')+'" data-act="wipe">'+(ui.armed==='wipe'?'Yakin, hapus semua data':'Mulai dari kosong')+'</button></div></div>';
}

/* ---------- render ---------- */
var TABS=[['beranda','Beranda'],['santri','Santri'],['absensi','Absensi'],['rekap','Rekap'],['nilai','Nilai'],['leger','Leger'],['rapor','Rapor'],['kelas','Kelas & Mapel'],['set','Pengaturan']];
var pages={beranda:pgBeranda,santri:pgSantri,absensi:pgAbsensi,rekap:pgRekap,nilai:pgNilai,leger:pgLeger,rapor:pgRapor,kelas:pgKelas,set:pgSet};
function render(){
  ensureSel();
  $('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(ui.tab===t[0]?' on':'')+'" data-act="tab" data-id="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+esc(t[1])+'</button>';}).join('');
  $('main').innerHTML=pages[ui.tab]();
  $('semchip').textContent=S.set.sem+' '+S.set.tahun;
  $('brandname').textContent=S.set.pesantren||'Absensi Santri';
  $('modal').innerHTML=ui.modal||'';
}
function arm(key,fn){
  if(ui.armed===key){ui.armed=null;fn();return;}
  ui.armed=key;render();clearTimeout(arm.t);arm.t=setTimeout(function(){if(ui.armed===key){ui.armed=null;render();}},4000);
}
function closeModal(){ui.modal=null;$('modal').innerHTML='';}
function val(id){var e=$(id);return e?e.value.trim():'';}

/* ---------- actions ---------- */
var acts={
  tab:function(b){ui.tab=b.dataset.id;ui.armed=null;render();window.scrollTo(0,0);var on=document.querySelector('.tab.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});},
  goabs:function(b){ui.abs.kelas=b.dataset.k;ui.abs.date=TODAY;ui.tab='absensi';render();window.scrollTo(0,0);},
  'abs-set':function(b){
    var key=ui.abs.date+'|'+ui.abs.kelas+'|'+ui.abs.sesi,rec=S.abs[key]=S.abs[key]||{},id=b.dataset.sid,st=b.dataset.st;
    if(rec[id]&&rec[id].s===st)delete rec[id];else rec[id]={s:st,k:(rec[id]&&st!=='H'?rec[id].k:'')||''};
    if(!Object.keys(rec).length)delete S.abs[key];save();render();},
  'abs-all':function(){var key=ui.abs.date+'|'+ui.abs.kelas+'|'+ui.abs.sesi,rec=S.abs[key]=S.abs[key]||{};santriOf(ui.abs.kelas).forEach(function(s){rec[s.id]={s:'H',k:''};});save();render();toast('Semua santri ditandai hadir');},
  'abs-clear':function(){arm('abs-clear',function(){delete S.abs[ui.abs.date+'|'+ui.abs.kelas+'|'+ui.abs.sesi];save();render();toast('Absensi dikosongkan');});},
  'abs-day':function(b){ui.abs.date=addDays(ui.abs.date,Number(b.dataset.d));render();},
  'santri-add':function(){if(!S.kelas.length){toast('Tambahkan kelas dahulu');return;}ui.modal=modalSantri(null);render();var e=$('f-nama');if(e)e.focus();},
  'santri-bulk':function(){if(!S.kelas.length){toast('Tambahkan kelas dahulu');return;}ui.modal=modalBulk();render();var e=$('b-text');if(e)e.focus();},
  'santri-edit':function(b){var s=S.santri.find(function(x){return x.id===b.dataset.id;});if(s){ui.modal=modalSantri(s);render();}},
  'santri-del':function(b){var id=b.dataset.id;arm('del-'+id,function(){
    S.santri=S.santri.filter(function(s){return s.id!==id;});
    Object.keys(S.abs).forEach(function(k){if(S.abs[k][id]){delete S.abs[k][id];if(!Object.keys(S.abs[k]).length)delete S.abs[k];}});
    Object.keys(S.nilai).forEach(function(k){if(k.split('|')[2]===id)delete S.nilai[k];});
    Object.keys(S.sikap).forEach(function(k){if(k.split('|')[2]===id)delete S.sikap[k];});
    save();render();toast('Santri dihapus');});},
  'modal-close':function(){closeModal();},
  'santri-save':function(b){
    var nama=val('f-nama');if(!nama){toast('Nama wajib diisi');return;}
    var id=b.dataset.id,o={nama:nama,nis:val('f-nis')||'',jk:val('f-jk'),kelas:val('f-kelas'),kamar:val('f-kamar'),tempat:val('f-tempat'),lahir:val('f-lahir'),wali:val('f-wali'),hp:val('f-hp'),alamat:val('f-alamat')};
    if(id){var s=S.santri.find(function(x){return x.id===id;});if(s){if(!o.nis)o.nis=s.nis;Object.assign(s,o);}}
    else{if(!o.nis)o.nis=nextNis();o.id=uid('s');S.santri.push(o);}
    save();closeModal();render();toast('Data santri tersimpan');},
  'bulk-save':function(){
    var kid=val('b-kelas'),lines=val('b-text').split('\n').map(function(x){return x.trim();}).filter(Boolean);
    if(!lines.length){toast('Daftar masih kosong');return;}
    lines.forEach(function(ln){var p=ln.split(/[;\t]/).map(function(x){return x.trim();}),nis='',nama=ln;if(p.length>1){nis=p[0];nama=p.slice(1).join(' ');}S.santri.push({id:uid('s'),nis:nis||nextNis(),nama:nama,jk:'L',kelas:kid,kamar:'',tempat:'',lahir:'',wali:'',hp:'',alamat:''});});
    save();closeModal();render();toast(lines.length+' santri ditambahkan');},
  'kelas-add':function(){S.kelas.push({id:uid('k'),nama:'Kelas baru',wali:''});save();render();},
  'kelas-del':function(b){var id=b.dataset.id;if(santriOf(id).length){toast('Pindahkan atau hapus santri di kelas ini dahulu');return;}arm('dk-'+id,function(){S.kelas=S.kelas.filter(function(k){return k.id!==id;});save();render();});},
  'mapel-add':function(){S.mapel.push({id:uid('m'),nama:'Mapel baru',pengajar:'',kkm:Number(S.set.kkm)||70});save();render();},
  'mapel-del':function(b){var id=b.dataset.id;arm('dm-'+id,function(){S.mapel=S.mapel.filter(function(m){return m.id!==id;});Object.keys(S.nilai).forEach(function(k){if(k.split('|')[3]===id)delete S.nilai[k];});save();render();});},
  'rapor-nav':function(b){var l=santriOf(ui.rapor.kelas),i=l.findIndex(function(s){return s.id===ui.rapor.santri;})+Number(b.dataset.d);if(i>=0&&i<l.length){ui.rapor.santri=l[i].id;render();}},
  'rapor-print':function(){if(framed){toast('Cetak tidak bisa dari tampilan web ini. Pakai file HTML versi unduhan, buka di browser, lalu cetak.');return;}window.print();},
  'rekap-copy':function(){var D=rekapData(),t=['Nama'].concat(Array.apply(null,Array(D.nd)).map(function(_,i){return i+1;}),['H','T','I','S','A','%']).join('\t');
    D.rows.forEach(function(r){t+='\n'+[r.s.nama].concat(r.days.map(function(x){return x||'';}),[r.c.H,r.c.T,r.c.I,r.c.S,r.c.A,r.pct==null?'':r.pct]).join('\t');});copyText(t,'Tabel disalin. Tempel ke Excel atau Sheets.');},
  'leger-copy':function(){var D=legerData(),t=['Nama'].concat(S.mapel.map(function(m){return m.nama;}),['Jumlah','Rata-rata','Peringkat']).join('\t');
    D.rows.forEach(function(r){t+='\n'+[r.s.nama].concat(r.v.map(function(v){return v==null?'':v;}),[Math.round(r.tot*10)/10,r.avg==null?'':Math.round(r.avg*10)/10,D.rk.map[r.s.id]||'']).join('\t');});copyText(t,'Leger disalin. Tempel ke Excel atau Sheets.');},
  'bk-copy':function(){var t=JSON.stringify(S);$('bk').value=t;$('bk').select();copyText(t,'Cadangan disalin. Simpan di tempat aman.');},
  'bk-dl':function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='cadangan-absensi-santri-'+TODAY+'.json';a.click();},
  'bk-pick':function(){var f=$('bk-file');if(f){f.value='';f.click();}},
  'bk-restore':function(){try{var o=JSON.parse($('bk').value);if(!o||!o.set||!Array.isArray(o.santri))throw 0;S=o;S.demo=false;save();render();toast('Data berhasil dipulihkan');}catch(e){toast('Cadangan tidak valid. Tempel JSON hasil Salin cadangan.');}},
  'load-demo':function(){arm('load-demo',function(){S=demo();save();render();toast('Data contoh dimuat');});},
  wipe:function(){arm('wipe',function(){S=blank();save();render();toast('Data dikosongkan');});},
  'clear-demo':function(){arm('clear-demo',function(){S=blank();save();render();toast('Data contoh dihapus. Mulai dari tab Kelas & Mapel.');});}
};
var ins={
  sq:function(t){ui.santri.q=t.value;$('slist').innerHTML=santriRows();},
  'abs-ket':function(t){var rec=S.abs[ui.abs.date+'|'+ui.abs.kelas+'|'+ui.abs.sesi];if(rec&&rec[t.dataset.sid]){rec[t.dataset.sid].k=t.value;save();}},
  nilai:function(t){
    var key=nk(t.dataset.sid,t.dataset.mid),o=S.nilai[key]=S.nilai[key]||{},v=t.value;
    if(v!==''){var x=Math.max(0,Math.min(100,Number(v)));if(isNaN(x))return;o[t.dataset.f]=x;}else delete o[t.dataset.f];
    save();
    var m=S.mapel.find(function(z){return z.id===t.dataset.mid;}),tr=t.closest('tr'),a=nilaiAkhir(o),r=a==null?null:Math.round(a*10)/10;
    var na=tr.querySelector('.na');na.textContent=r==null?'-':fmt(r);na.classList.toggle('low',r!=null&&r<m.kkm);
    tr.querySelector('.np').textContent=predL(r);$('nsum').innerHTML=nilaiSummary();},
  sikap:function(t){var s=curSantri();if(!s)return;var o=S.sikap[sk(s.id)]=S.sikap[sk(s.id)]||{};o[t.dataset.f]=t.value;save();$('paper').innerHTML=raporHTML(s);}
};
var chs={
  ui:function(t){ui[t.dataset.p][t.dataset.k]=t.value;render();},
  kelas:function(t){var k=S.kelas.find(function(x){return x.id===t.dataset.id;});if(k){k[t.dataset.f]=t.value.trim();save();toast('Tersimpan');}},
  mapel:function(t){var m=S.mapel.find(function(x){return x.id===t.dataset.id;});if(m){m[t.dataset.f]=t.dataset.f==='kkm'?(Number(t.value)||0):t.value.trim();save();toast('Tersimpan');}},
  set:function(t){S.set[t.dataset.k]=t.value.trim();save();render();},
  bobot:function(t){S.set.bobot[t.dataset.k]=Number(t.value)||0;save();render();},
  sesi:function(t){var l=t.value.split(',').map(function(x){return x.replace(/\|/g,'').trim();}).filter(Boolean).filter(function(x,i,a){return a.indexOf(x)===i;});if(!l.length)l=['Sekolah'];S.set.sesi=l;if(l.indexOf(S.set.sesiRapor)<0)S.set.sesiRapor='*';save();render();},
  tglrapor:function(t){S.set.tglRapor=t.value;save();$('paper').innerHTML=raporHTML(curSantri());}
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b)return;var f=acts[b.dataset.act];if(f)f(b,e);});
document.addEventListener('input',function(e){var t=e.target,k=t.dataset&&t.dataset.in;if(k&&ins[k])ins[k](t,e);});
document.addEventListener('change',function(e){var t=e.target,k=t.dataset&&t.dataset.ch;if(k&&chs[k])chs[k](t,e);});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.modal)closeModal();});
window.__app={pages:pages,ui:ui,render:render,getS:function(){return S;}};
render();
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='bk-file'||!e.target.files||!e.target.files[0])return;
  var rd=new FileReader();
  rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.set||!Array.isArray(o.santri))throw 0;if(!confirm('Impor akan MENGGANTI semua data saat ini dengan isi file. Lanjutkan?'))return;S=o;S.demo=false;save();render();toast('Data berhasil diimpor dari file');}catch(err){toast('File tidak valid. Pilih file cadangan .json dari aplikasi ini.');}};
  rd.onerror=function(){toast('Gagal membaca file.');};
  rd.readAsText(e.target.files[0]);
});
})();
</script>

</body></html>
